name: Continuous Integration & Production Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Lint, Test & Security Audit
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Oxlint Linter
        run: npm run lint

      - name: Execute Master Test Suite (219 Questions + Security + Auth Onboarding)
        run: npm test

      - name: Run Static Application Security Testing (SAST)
        run: npm run security-scan

      - name: Build Vite Production Frontend Bundle
        run: npm run build
